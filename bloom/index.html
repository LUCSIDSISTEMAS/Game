<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#030203" />
  <meta name="color-scheme" content="dark" />
  <title>Uma coisa pra você 🌹</title>
  <meta name="description" content="Toque para abrir." />
  <meta property="og:title" content="Uma coisa pra você 🌹" />
  <meta property="og:description" content="Toque para abrir." />
  <style>
    :root { --bg:#020102; --panel-border:rgba(255,52,105,.10); --white:#fff7fa; }
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;-webkit-tap-highlight-color:transparent;user-select:none}
    body{min-height:100svh;display:grid;place-items:center;color:var(--white);background:radial-gradient(circle at 50% 45%,rgba(89,0,31,.12) 0 17%,rgba(22,0,8,.06) 35%,transparent 65%),#020102}
    .ambient{position:fixed;inset:-20vmax;pointer-events:none;opacity:.32;background:radial-gradient(circle at 50% 47%,rgba(255,0,69,.14),transparent 18%),radial-gradient(circle at 48% 50%,rgba(139,0,43,.07),transparent 34%);filter:blur(28px);transform:scale(.85);transition:opacity 1.1s ease,transform 6s cubic-bezier(.2,.7,.2,1)}
    body.started .ambient{opacity:.78;transform:scale(1.18)}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");mix-blend-mode:screen}
    .start-card{position:relative;z-index:30;width:min(84vw,340px);padding:21px 20px 18px;border:1px solid var(--panel-border);border-radius:10px;background:radial-gradient(circle at 18% 0%,rgba(255,23,79,.10),transparent 36%),linear-gradient(180deg,rgba(26,9,17,.93),rgba(13,7,10,.95));box-shadow:0 0 80px rgba(130,0,36,.10),inset 0 1px rgba(255,255,255,.018),0 18px 80px rgba(0,0,0,.72);text-align:center;transform:translateY(-3vh);transition:opacity .48s ease,transform .48s cubic-bezier(.3,.7,.2,1),filter .48s ease}
    body.started .start-card{opacity:0;transform:translateY(-3vh) scale(.94);filter:blur(4px);pointer-events:none}
    .mini-rose{width:28px;height:36px;margin:0 auto 8px;position:relative;filter:drop-shadow(0 0 7px rgba(255,15,72,.55))}.mini-rose:before{content:"";position:absolute;left:12px;top:15px;width:3px;height:20px;border-radius:4px;background:#1b8b44}.mini-rose:after{content:"";position:absolute;left:4px;top:2px;width:20px;height:20px;border-radius:55% 45% 52% 48%/52% 55% 45% 48%;background:radial-gradient(circle at 52% 58%,#97001f 0 16%,transparent 17%),radial-gradient(ellipse at 35% 45%,#ff214f 0 24%,transparent 25%),radial-gradient(ellipse at 68% 45%,#e70038 0 27%,transparent 28%),linear-gradient(145deg,#ff2e57,#ad001f 70%);transform:rotate(-5deg)}
    .start-card h1{margin:0 0 16px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,6vw,27px);font-weight:700;line-height:1;letter-spacing:-.04em;color:#fff9fb;text-shadow:0 2px 8px rgba(0,0,0,.6)}
    .progress-track{width:100%;height:2px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.10);margin-bottom:12px;box-shadow:inset 0 0 1px rgba(255,255,255,.12)}.progress{height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,#ff376a,#ff0a46);box-shadow:0 0 9px rgba(255,10,70,.55);transition:width .55s cubic-bezier(.2,.7,.2,1)}
    .status{height:16px;margin-bottom:11px;font-size:8px;line-height:16px;color:#b8aeb2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
    .bloom-btn{appearance:none;width:100%;height:39px;border:0;border-radius:5px;color:rgba(255,255,255,.37);background:#251e21;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.10em;cursor:default;transition:transform .16s ease,background .4s ease,color .4s ease,box-shadow .4s ease}.bloom-btn.ready{cursor:pointer;color:#fff;background:linear-gradient(180deg,#ff2759,#ff0b48);box-shadow:0 0 20px rgba(255,10,70,.30),inset 0 1px rgba(255,255,255,.20)}.bloom-btn.ready:active{transform:scale(.982)}
    .scene{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .55s ease .30s}body.started .scene{opacity:1}.flower-wrap{width:min(78vw,390px);height:min(74vh,680px);position:relative;transform:translateY(1.8vh)}
    .flower-glow{position:absolute;left:50%;top:36%;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,0,64,.18) 0 20%,rgba(179,0,49,.09) 40%,transparent 72%);filter:blur(16px);transform:translate(-50%,-50%) scale(.35);opacity:0}body.started .flower-glow{animation:glow-in 6.4s cubic-bezier(.16,.75,.3,1) .9s forwards}@keyframes glow-in{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}25%{opacity:.12}68%{opacity:.64;transform:translate(-50%,-50%) scale(.92)}100%{opacity:.92;transform:translate(-50%,-50%) scale(1.08)}}
    .flower{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px rgba(255,0,55,.08))}.stem{fill:none;stroke:url(#stemGradient);stroke-width:5.2;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:150}body.started .stem{animation:draw-stem 1.45s cubic-bezier(.27,.68,.23,1) 1s forwards}@keyframes draw-stem{to{stroke-dashoffset:0}}
    .leaf{opacity:0;transform-box:fill-box;transform-origin:center right;filter:drop-shadow(0 0 3px rgba(16,128,58,.18))}.leaf.right{transform-origin:center left}body.started .leaf.left{animation:leaf-left .72s cubic-bezier(.2,.9,.25,1) 1.85s forwards}body.started .leaf.right{animation:leaf-right .72s cubic-bezier(.2,.9,.25,1) 2.08s forwards}@keyframes leaf-left{from{opacity:0;transform:scale(.05) rotate(18deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes leaf-right{from{opacity:0;transform:scale(.05) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    .sepal{opacity:0;transform-box:fill-box;transform-origin:center bottom;transform:scale(.3) translateY(7px)}body.started .sepal{animation:sepal-in .55s ease 2.2s forwards}@keyframes sepal-in{to{opacity:1;transform:scale(1) translateY(0)}}.bud-core{opacity:0;transform-box:fill-box;transform-origin:center bottom;transform:scale(.12,.18) translateY(20px)}body.started .bud-core{animation:bud-grow 1.15s cubic-bezier(.17,.78,.26,1) 2.34s forwards}@keyframes bud-grow{0%{opacity:0;transform:scale(.10,.15) translateY(22px)}35%{opacity:1}100%{opacity:1;transform:scale(.76,.93) translateY(0)}}
    .petal{opacity:0;transform-box:fill-box;transform-origin:center bottom;will-change:transform,opacity}body.started .p1{animation:p1 2.55s cubic-bezier(.13,.78,.25,1) 2.78s forwards}body.started .p2{animation:p2 2.45s cubic-bezier(.13,.78,.25,1) 2.86s forwards}body.started .p3{animation:p3 2.42s cubic-bezier(.13,.78,.25,1) 2.92s forwards}body.started .p4{animation:p4 2.34s cubic-bezier(.13,.78,.25,1) 3.03s forwards}body.started .p5{animation:p5 2.34s cubic-bezier(.13,.78,.25,1) 3.05s forwards}body.started .p6{animation:p6 2.2s cubic-bezier(.13,.78,.25,1) 3.15s forwards}body.started .p7{animation:p7 2.2s cubic-bezier(.13,.78,.25,1) 3.2s forwards}body.started .p8{animation:p8 2.1s cubic-bezier(.13,.78,.25,1) 3.28s forwards}body.started .p9{animation:p9 2.05s cubic-bezier(.13,.78,.25,1) 3.34s forwards}body.started .p10{animation:p10 2s cubic-bezier(.13,.78,.25,1) 3.4s forwards}body.started .p11{animation:p11 1.95s cubic-bezier(.13,.78,.25,1) 3.47s forwards}body.started .p12{animation:p12 1.86s cubic-bezier(.13,.78,.25,1) 3.55s forwards}body.started .p13{animation:p13 1.8s cubic-bezier(.13,.78,.25,1) 3.62s forwards}body.started .p14{animation:p14 1.7s cubic-bezier(.13,.78,.25,1) 3.68s forwards}
    @keyframes p1{0%{opacity:0;transform:translate(54px,18px) rotate(-52deg) scale(.18,.30)}30%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}@keyframes p2{0%{opacity:0;transform:translate(-54px,18px) rotate(52deg) scale(.18,.30)}30%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}@keyframes p3{0%{opacity:0;transform:translate(36px,12px) rotate(-38deg) scale(.22,.36)}30%{opacity:1}100%{opacity:1;transform:none}}@keyframes p4{0%{opacity:0;transform:translate(-36px,12px) rotate(38deg) scale(.22,.36)}30%{opacity:1}100%{opacity:1;transform:none}}@keyframes p5{0%{opacity:0;transform:translate(18px,12px) rotate(-24deg) scale(.25,.42)}25%{opacity:1}100%{opacity:1;transform:none}}@keyframes p6{0%{opacity:0;transform:translate(-18px,12px) rotate(24deg) scale(.25,.42)}25%{opacity:1}100%{opacity:1;transform:none}}@keyframes p7{0%{opacity:0;transform:translate(18px,8px) rotate(-20deg) scale(.30,.45)}25%{opacity:1}100%{opacity:1;transform:none}}@keyframes p8{0%{opacity:0;transform:translate(-18px,8px) rotate(20deg) scale(.30,.45)}25%{opacity:1}100%{opacity:1;transform:none}}@keyframes p9{0%{opacity:0;transform:translate(10px,7px) rotate(-16deg) scale(.34,.50)}20%{opacity:1}100%{opacity:1;transform:none}}@keyframes p10{0%{opacity:0;transform:translate(-10px,7px) rotate(16deg) scale(.34,.50)}20%{opacity:1}100%{opacity:1;transform:none}}@keyframes p11{0%{opacity:0;transform:translate(7px,5px) rotate(-12deg) scale(.40,.58)}20%{opacity:1}100%{opacity:1;transform:none}}@keyframes p12{0%{opacity:0;transform:translate(-7px,5px) rotate(12deg) scale(.40,.58)}20%{opacity:1}100%{opacity:1;transform:none}}@keyframes p13{0%{opacity:0;transform:translateY(7px) rotate(-8deg) scale(.42,.60)}18%{opacity:1}100%{opacity:1;transform:none}}@keyframes p14{0%{opacity:0;transform:translateY(7px) rotate(8deg) scale(.42,.60)}18%{opacity:1}100%{opacity:1;transform:none}}
    .flower-head{transform-origin:150px 218px}body.started .flower-head{animation:breathe 4.5s ease-in-out 5.3s infinite alternate}@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.018) translateY(-1px)}}
    .message{position:absolute;left:50%;top:69%;width:min(92vw,520px);transform:translate(-50%,18px);opacity:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:clamp(19px,5.1vw,28px);line-height:1.35;letter-spacing:.045em;color:rgba(255,240,245,.92);text-shadow:0 0 18px rgba(255,14,72,.17),0 2px 10px #000}body.started .message{animation:message-in 1.4s ease 6.15s forwards}@keyframes message-in{to{opacity:1;transform:translate(-50%,0)}}.tiny-rose{display:block;width:11px;height:11px;margin:7px auto 0;border-radius:60% 40% 60% 40%;background:#e70b42;box-shadow:0 0 7px rgba(255,10,70,.35);transform:rotate(45deg) scale(0)}body.started .tiny-rose{animation:tiny-in .6s cubic-bezier(.2,.8,.2,1) 7s forwards}@keyframes tiny-in{to{transform:rotate(45deg) scale(1)}}
    .spark{position:absolute;left:50%;top:36%;width:4px;height:4px;border-radius:50%;background:#ff1b52;box-shadow:0 0 7px #ff174f;opacity:0}body.started .s1{animation:spark1 4.5s ease-out 4.5s infinite}body.started .s2{animation:spark2 4.9s ease-out 4.9s infinite}body.started .s3{animation:spark3 5.2s ease-out 5.4s infinite}body.started .s4{animation:spark4 4.7s ease-out 5.8s infinite}body.started .s5{animation:spark5 5.4s ease-out 6.2s infinite}@keyframes spark1{0%{opacity:0;transform:translate(0,8px) scale(.4)}12%{opacity:.75}75%{opacity:.2}100%{opacity:0;transform:translate(80px,-125px) scale(1.2)}}@keyframes spark2{0%{opacity:0;transform:translate(0,8px) scale(.5)}12%{opacity:.65}100%{opacity:0;transform:translate(-94px,-96px) scale(.7)}}@keyframes spark3{0%{opacity:0;transform:translate(12px,0) scale(.5)}15%{opacity:.55}100%{opacity:0;transform:translate(112px,-58px) scale(1)}}@keyframes spark4{0%{opacity:0;transform:translate(-10px,6px) scale(.4)}12%{opacity:.6}100%{opacity:0;transform:translate(-64px,-142px) scale(.9)}}@keyframes spark5{0%{opacity:0;transform:translate(0,3px) scale(.4)}14%{opacity:.5}100%{opacity:0;transform:translate(48px,-160px) scale(.7)}}
    .replay{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:40;transform:translateX(-50%) translateY(12px);opacity:0;border:0;background:transparent;color:rgba(255,255,255,.28);font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.10em;padding:10px 14px;cursor:pointer;pointer-events:none;transition:color .2s ease}body.finished .replay{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;transition:opacity 1s ease,transform 1s ease,color .2s ease}.replay:active{color:rgba(255,255,255,.6)}
    @media(max-height:630px){.flower-wrap{height:94vh;width:min(62vw,330px)}.message{top:73%;font-size:17px}.start-card{transform:translateY(-1vh)}}
  </style>
</head>
<body>
  <div class="ambient"></div><div class="grain"></div>
  <main class="start-card" id="card" aria-live="polite">
    <div class="mini-rose" aria-hidden="true"></div><h1>Love.css</h1>
    <div class="progress-track"><div class="progress" id="progress"></div></div>
    <div class="status" id="status">Pronto para compilar...</div>
    <button class="bloom-btn" id="bloomBtn" type="button" disabled>TOQUE PARA FLORESCER</button>
  </main>
  <section class="scene" aria-hidden="true"><div class="flower-wrap"><div class="flower-glow"></div><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
    <svg class="flower" viewBox="0 0 300 480" role="img" aria-label="Uma rosa vermelha florescendo">
      <defs>
        <linearGradient id="stemGradient" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#07532a"/><stop offset=".48" stop-color="#0f7f40"/><stop offset="1" stop-color="#169748"/></linearGradient>
        <linearGradient id="leafGradientL" x1="1" y1=".5" x2="0" y2=".4"><stop offset="0" stop-color="#118847"/><stop offset="1" stop-color="#075326"/></linearGradient><linearGradient id="leafGradientR" x1="0" y1=".5" x2="1" y2=".4"><stop offset="0" stop-color="#128b47"/><stop offset="1" stop-color="#064c24"/></linearGradient>
        <radialGradient id="budGradient" cx="46%" cy="25%" r="78%"><stop offset="0" stop-color="#ff315c"/><stop offset=".40" stop-color="#e1093e"/><stop offset="1" stop-color="#880018"/></radialGradient>
        <linearGradient id="petalOuter" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#ff2356"/><stop offset=".45" stop-color="#d90036"/><stop offset="1" stop-color="#7f0019"/></linearGradient><linearGradient id="petalOuter2" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ff164d"/><stop offset=".48" stop-color="#c80031"/><stop offset="1" stop-color="#720015"/></linearGradient>
        <radialGradient id="petalMid" cx="45%" cy="20%" r="85%"><stop offset="0" stop-color="#ff2b58"/><stop offset=".36" stop-color="#e20840"/><stop offset=".82" stop-color="#9e001f"/><stop offset="1" stop-color="#650012"/></radialGradient><radialGradient id="petalInner" cx="50%" cy="28%" r="75%"><stop offset="0" stop-color="#ff3a63"/><stop offset=".42" stop-color="#da0739"/><stop offset="1" stop-color="#780016"/></radialGradient>
        <filter id="roseGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path class="stem" d="M150 390 C149 350 151 316 150 278 C149 252 150 231 150 214"/>

        <path class="petal p5" fill="url(#petalMid)" d="M150 202 C124 199 104 182 94 158 C112 164 127 155 139 140 C139 162 145 187 150 202 Z"/><path class="petal p6" fill="url(#petalMid)" d="M150 202 C176 199 196 182 206 158 C188 164 173 155 161 140 C161 162 155 187 150 202 Z"/><path class="petal p7" fill="url(#petalMid)" d="M148 197 C126 188 116 169 117 147 C130 157 143 153 151 138 C157 159 156 181 148 197 Z"/><path class="petal p8" fill="url(#petalMid)" d="M152 197 C174 188 184 169 183 147 C170 157 157 153 149 138 C143 159 144 181 152 197 Z"/>
        <path class="petal p9" fill="url(#petalInner)" d="M148 190 C134 181 130 165 136 150 C144 156 153 155 160 146 C163 164 158 181 148 190 Z"/><path class="petal p10" fill="url(#petalInner)" d="M152 190 C166 181 170 165 164 150 C156 156 147 155 140 146 C137 164 142 181 152 190 Z"/><path class="petal p11" fill="url(#petalInner)" d="M150 184 C140 177 140 163 148 154 C156 157 160 167 155 177 C154 180 152 182 150 184 Z"/><path class="petal p12" fill="url(#petalInner)" d="M149 183 C157 177 158 166 153 158 C146 158 141 166 144 174 C145 178 147 181 149 183 Z" opacity=".95"/><path class="petal p13" fill="#a90025" d="M150 183 C142 177 144 166 151 161 C159 167 158 178 150 183 Z"/><path class="petal p14" fill="#6f0014" d="M150 178 C146 174 147 168 151 166 C154 170 154 175 150 178 Z"/>
      </g>
    </svg>
    <div class="message">Sinceramente, eu amo você.<span class="tiny-rose" aria-hidden="true"></span></div>
  </div></section>
  <button class="replay" id="replay" type="button">REVER</button>
  <script>(()=>{const body=document.body,btn=document.getElementById('bloomBtn'),status=document.getElementById('status'),progress=document.getElementById('progress'),replay=document.getElementById('replay');let timers=[],started=false;const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id)};function boot(){timers.forEach(clearTimeout);timers=[];started=false;body.classList.remove('started','finished');btn.disabled=true;btn.classList.remove('ready');btn.textContent='TOQUE PARA FLORESCER';status.textContent='Pronto para compilar...';progress.style.width='8%';later(()=>{status.textContent='Cultivando pétalas digitais...';progress.style.width='42%'},680);later(()=>{status.textContent='Adicionando textura de veludo...';progress.style.width='72%'},1420);later(()=>{status.textContent='Preparando um pouco de coragem...';progress.style.width='91%'},2160);later(()=>{status.textContent='Pronto para florescer!';progress.style.width='100%';btn.disabled=false;btn.classList.add('ready')},2860)}function bloom(){if(started||btn.disabled)return;started=true;btn.textContent='FLORESCENDO...';body.classList.add('started');later(()=>body.classList.add('finished'),7900)}btn.addEventListener('click',bloom);replay.addEventListener('click',()=>{body.classList.remove('started','finished');void document.documentElement.offsetWidth;boot()});boot()})();</script>
</body>
</html>
